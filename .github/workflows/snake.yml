name: Gerar Snake Contribution

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gerar-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar snake SVG
        uses: Platane/[email protected]
        with:
          github_user_name: pessoaizaac-design
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: Enviar para a branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
